[pytest]
# Real test collection for the Intelligence Framework.
# Unit tests run offline (pure logic + mocked feeds) and are the default.
# Integration tests touch live data feeds or the full brief pipeline and are
# deselected by default — run them explicitly with:  pytest -m integration
python_files   = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not integration" -ra
markers =
    integration: exercises live data feeds or the full brief pipeline (deselected by default)
